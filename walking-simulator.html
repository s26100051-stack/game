<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Third-Person Walking Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(15, 23, 42, 0.75);
      padding: 12px 16px;
      border-radius: 8px;
      backdrop-filter: blur(4px);
      pointer-events: none;
      line-height: 1.5;
      font-size: 14px;
    }
    #hud strong { color: #38bdf8; }
  </style>
  <!-- Import map for Three.js via CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div><strong>W A S D</strong> / Arrows — Move Character</div>
    <div><strong>Shift</strong> — Sprint | <strong>Space</strong> — Jump</div>
    <div><strong>Mouse Drag</strong> — Orbit Camera | <strong>Scroll</strong> — Zoom</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // 1. Scene, Camera & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // 2. OrbitControls (Camera follows player target)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going underground
    controls.minDistance = 3;
    controls.maxDistance = 18;

    // 3. Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e4, 1.5);
    dirLight.position.set(20, 35, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 100;
    const d = 35;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    // 4. Environment (Ground, Grid & Scenery Props)
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4a7c59, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(200, 100, 0x3b6347, 0x3b6347);
    grid.position.y = 0.01;
    scene.add(grid);

    // Add random trees/pillars for spatial reference while walking
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
    const leavesMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27 });
    for (let i = 0; i < 40; i++) {
      const x = (Math.random() - 0.5) * 140;
      const z = (Math.random() - 0.5) * 140;
      if (Math.hypot(x, z) < 6) continue; // Keep spawn clear

      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2.5, 8), trunkMat);
      trunk.position.y = 1.25;
      trunk.castShadow = true;
      trunk.receiveShadow = true;

      const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.8, 4, 8), leavesMat);
      leaves.position.y = 4;
      leaves.castShadow = true;

      tree.add(trunk, leaves);
      tree.position.set(x, 0, z);
      scene.add(tree);
    }

    // 5. Build Articulated NPC / Player Character
    function createCharacter(shirtColor = 0x3b82f6) {
      const group = new THREE.Group();

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
      const shirtMat = new THREE.MeshStandardMaterial({ color: shirtColor });
      const pantsMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });

      // Torso
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.35), shirtMat);
      torso.position.y = 1.25;
      torso.castShadow = true;
      group.add(torso);

      // Head
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
      head.position.y = 1.98;
      head.castShadow = true;
      group.add(head);

      // Limbs with pivot points at joints
      const createLimb = (w, h, d, mat, x, y) => {
        const pivot = new THREE.Group();
        pivot.position.set(x, y, 0);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        mesh.position.y = -h / 2;
        mesh.castShadow = true;
        pivot.add(mesh);
        group.add(pivot);
        return pivot;
      };

      const leftArm = createLimb(0.22, 0.75, 0.22, skinMat, -0.48, 1.65);
      const rightArm = createLimb(0.22, 0.75, 0.22, skinMat, 0.48, 1.65);
      const leftLeg = createLimb(0.26, 0.8, 0.26, pantsMat, -0.2, 0.8);
      const rightLeg = createLimb(0.26, 0.8, 0.26, pantsMat, 0.2, 0.8);

      return { group, leftArm, rightArm, leftLeg, rightLeg, walkTime: 0 };
    }

    const player = createCharacter(0x2563eb);
    scene.add(player.group);

    // Optional: Add a wandering AI NPC nearby
    const npc = createCharacter(0xef4444);
    npc.group.position.set(5, 0, -5);
    scene.add(npc.group);
    let npcAngle = 0;

    // 6. Keyboard Input Tracking
    const keys = {};
    window.addEventListener('keydown', (e) => { keys[e.code] = true; });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // Physics & Movement Constants
    let velocityY = 0;
    const gravity = -24;
    const jumpForce = 9;
    let isGrounded = true;

    // Animate limb swing
    function animateCharacter(charObj, isMoving, speedMultiplier, delta) {
      if (isMoving) {
        charObj.walkTime += delta * 8 * speedMultiplier;
        const swing = Math.sin(charObj.walkTime) * 0.65;
        charObj.leftLeg.rotation.x = swing;
        charObj.rightLeg.rotation.x = -swing;
        charObj.leftArm.rotation.x = -swing * 0.8;
        charObj.rightArm.rotation.x = swing * 0.8;
      } else {
        // Smoothly return limbs to idle
        charObj.leftLeg.rotation.x *= 0.85;
        charObj.rightLeg.rotation.x *= 0.85;
        charObj.leftArm.rotation.x *= 0.85;
        charObj.rightArm.rotation.x *= 0.85;
      }
    }

    // 7. Main Animation Loop
    const clock = new THREE.Clock();
    const moveDir = new THREE.Vector3();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      // Camera-relative movement vectors
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      right.crossVectors(forward, camera.up).normalize();

      moveDir.set(0, 0, 0);
      if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

      const isMoving = moveDir.lengthSq() > 0;
      const isSprinting = keys['ShiftLeft'] || keys['ShiftRight'];
      const speed = isSprinting ? 10 : 5;

      if (isMoving) {
        moveDir.normalize();
        const displacement = moveDir.clone().multiplyScalar(speed * delta);
        player.group.position.add(displacement);
        camera.position.add(displacement); // Keep camera offset steady while walking

        // Smoothly rotate character toward movement direction
        const targetAngle = Math.atan2(moveDir.x, moveDir.z);
        let diff = targetAngle - player.group.rotation.y;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        player.group.rotation.y += diff * Math.min(1, delta * 12);
      }

      // Jump & Gravity
      if (keys['Space'] && isGrounded) {
        velocityY = jumpForce;
        isGrounded = false;
      }
      velocityY += gravity * delta;
      player.group.position.y += velocityY * delta;

      if (player.group.position.y <= 0) {
        player.group.position.y = 0;
        velocityY = 0;
        isGrounded = true;
      }

      animateCharacter(player, isMoving && isGrounded, isSprinting ? 1.5 : 1, delta);

      // Simple wandering loop for the red NPC
      npcAngle += delta * 0.6;
      npc.group.position.x = Math.cos(npcAngle) * 6;
      npc.group.position.z = Math.sin(npcAngle) * 6;
      npc.group.rotation.y = -npcAngle;
      animateCharacter(npc, true, 0.8, delta);

      // Update OrbitControls target to follow player chest height
      controls.target.set(
        player.group.position.x,
        player.group.position.y + 1.4,
        player.group.position.z
      );
      controls.update();

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
